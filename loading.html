<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROOKI — Starting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c4b5fd;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .logo {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #a78bfa;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(167, 139, 250, 0.6);
    }
    .tagline {
      font-size: 11px;
      color: #6d28d9;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #2e1065;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 13px;
      color: #8b5cf6;
      margin-bottom: 20px;
      min-height: 22px;
      max-width: 320px;
    }
    .progress-bar {
      width: 240px;
      height: 3px;
      background: #1e1b2e;
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto 24px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #c026d3);
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .services {
      font-size: 11px;
      color: #4c1d95;
    }
    .service-item {
      margin: 6px 0;
      opacity: 0.5;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .service-item.ready {
      opacity: 1;
      color: #a78bfa;
    }
    .service-item.error {
      opacity: 1;
      color: #ef4444;
    }
    .check {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid currentColor;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }
    .service-item.ready .check {
      background: #a78bfa;
      color: #0a0a0f;
      border-color: #a78bfa;
    }
    .service-item.error .check {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">ROOKI</div>
    <div class="tagline">NATIVE DESKTOP AGENT</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Initializing services...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="services">
      <div class="service-item" id="svc-stt">
        <span class="check">✓</span>
        <span>Parakeet STT</span>
      </div>
      <div class="service-item" id="svc-agent">
        <span class="check">✓</span>
        <span>Agent Bridge</span>
      </div>
      <div class="service-item" id="svc-tts">
        <span class="check">✓</span>
        <span>Kokoro TTS</span>
      </div>
      <div class="service-item" id="svc-ui">
        <span class="check">✓</span>
        <span>Interface</span>
      </div>
    </div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const progressEl = document.getElementById('progress');
    const spinnerEl = document.getElementById('spinner');
    
    const services = {
      stt: { port: 8765, path: '/health', ready: false },
      agent: { port: 8766, path: '/ping', ready: false },
      tts: { port: 8767, path: '/health', ready: false },
      ui: { port: 5173, path: '/', ready: false }
    };
    
    let totalReady = 0;
    const totalServices = Object.keys(services).length;
    
    function updateProgress() {
      const pct = Math.round((totalReady / totalServices) * 100);
      progressEl.style.width = pct + '%';
    }
    
    function markReady(name) {
      const el = document.getElementById('svc-' + name);
      if (el) el.classList.add('ready');
      if (!services[name].ready) {
        services[name].ready = true;
        totalReady++;
        updateProgress();
      }
    }
    
    function markError(name) {
      const el = document.getElementById('svc-' + name);
      if (el) el.classList.add('error');
    }
    
    async function checkService(name) {
      const svc = services[name];
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 2000);
        const r = await fetch(`http://127.0.0.1:${svc.port}${svc.path}`, {
          signal: ctrl.signal,
          mode: 'no-cors'
        });
        clearTimeout(tid);
        return true;
      } catch {
        return false;
      }
    }
    
    async function pollServices() {
      const checks = Object.keys(services).map(async (name) => {
        const ok = await checkService(name);
        if (ok) {
          markReady(name);
          return true;
        }
        return false;
      });
      
      await Promise.all(checks);
      
      if (totalReady >= totalServices) {
        statusEl.textContent = 'ROOKI is ready!';
        spinnerEl.style.display = 'none';
        updateProgress();
        // Redirect to main UI
        setTimeout(() => {
          window.location.href = 'http://localhost:5173';
        }, 800);
      } else {
        // Continue polling
        setTimeout(pollServices, 1000);
      }
    }
    
    // Check if UI is already ready (fast path)
    async function fastCheck() {
      const ok = await checkService('ui');
      if (ok) {
        markReady('ui');
        statusEl.textContent = 'Interface ready, checking services...';
      }
    }
    
    // Start
    fastCheck().then(() => {
      pollServices();
    });
    
    // Update status messages based on what's ready
    setInterval(() => {
      if (!services.stt.ready) {
        statusEl.textContent = 'Loading Parakeet STT model...';
      } else if (!services.agent.ready) {
        statusEl.textContent = 'Starting Agent bridge...';
      } else if (!services.tts.ready) {
        statusEl.textContent = 'Initializing Kokoro TTS...';
      } else if (!services.ui.ready) {
        statusEl.textContent = 'Starting interface...';
      }
    }, 500);
  </script>
</body>
</html>
