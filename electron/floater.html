<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --isize: 48px;
    --iop: 0.7;
    --cop: 0.92;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #app { position: relative; width: 380px; height: 250px; }

  /* ---------------- floating icon ---------------- */
  .ficon {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    width: var(--isize);
    height: var(--isize);
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #2a2340, #14101f 68%);
    border: 1px solid rgba(139, 92, 246, 0.45);
    box-shadow:
      0 4px 18px rgba(0, 0, 0, 0.55),
      0 0 14px rgba(139, 92, 246, 0.35);
    display: grid;
    place-items: center;
    cursor: default;
    -webkit-app-region: drag;
    opacity: var(--iop);
  }
  .ficon .glyph {
    font-weight: 700;
    font-size: calc(var(--isize) * 0.52);
    letter-spacing: -1px;
    color: #e9e4ff;
    text-shadow: 0 0 10px currentColor;
    pointer-events: none;
  }
  .ficon::after { /* state halo */
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.3s ease;
    pointer-events: none;
  }
  .ficon[data-state="listening"]::after { border-color: rgba(34, 211, 238, 0.8); animation: pulse 1.6s ease-out infinite; }
  .ficon[data-state="thinking"]::after { border-color: rgba(167, 139, 250, 0.8); animation: pulse 1.1s ease-out infinite; }
  .ficon[data-state="speaking"]::after { border-color: rgba(244, 114, 182, 0.85); animation: pulse 0.7s ease-out infinite; }
  .ficon[data-state="notice"]::after { border-color: rgba(251, 191, 36, 0.9); }
  .ficon[data-state="error"]::after { border-color: rgba(251, 113, 133, 0.9); }
  @keyframes pulse {
    0% { transform: scale(0.85); opacity: 0.9; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .ficon[data-state="listening"] { border-color: rgba(34, 211, 238, 0.5); }
  .ficon[data-state="thinking"] { border-color: rgba(167, 139, 250, 0.55); }
  .ficon[data-state="speaking"] { border-color: rgba(244, 114, 182, 0.55); }
  .ficon[data-state="notice"] { border-color: rgba(251, 191, 36, 0.55); }
  .ficon[data-state="error"] { border-color: rgba(251, 113, 133, 0.6); }

  /* notification pip */
  .pip {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fbbf24;
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.9);
    display: none;
    pointer-events: none;
  }
  .ficon.notify .pip { display: block; }

  /* hover hint — the only discoverability affordance on a 0.5in icon */
  .hint {
    position: absolute;
    left: calc(var(--isize) + 12px);
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    font-size: 10.5px;
    letter-spacing: 0.3px;
    color: rgba(236, 231, 251, 0.75);
    background: rgba(10, 8, 22, 0.55);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 8px;
    padding: 4px 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    backdrop-filter: blur(6px);
  }
  .ficon:hover ~ .hint, .ficon:focus-visible ~ .hint { opacity: 1; }

  /* ---------------- conversation panel ---------------- */
  .rcon {
    position: absolute;
    left: 50%;
    bottom: calc(var(--isize) + 34px);
    transform: translateX(-50%) translateY(6px) scale(0.96);
    width: max-content;
    max-width: 340px;
    background: rgba(18, 14, 30, var(--cop));
    border: 1px solid rgba(139, 92, 246, 0.4);
    border-radius: 14px;
    padding: 8px 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 18px rgba(124, 58, 237, 0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1));
    backdrop-filter: blur(10px);
  }
  .rcon.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .rcon .row {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .rcon .row + .row { margin-top: 6px; }
  .rcon .chip {
    flex: none;
    margin-top: 1px;
    padding: 1px 7px;
    border-radius: 9px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .rcon .chip.you { background: rgba(34, 211, 238, 0.16); color: #67e8f9; }
  .rcon .chip.roo { background: rgba(244, 114, 182, 0.16); color: #f9a8d4; }
  .rcon .txt {
    max-width: 280px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: #ece7fb;
  }

  @media (prefers-reduced-motion: reduce) {
    .ficon::after, .rcon, .ficon { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="ficon" id="ficon" data-state="idle" title="ROOKI — click to open, right-click for menu" tabindex="0">
      <span class="glyph">R</span>
      <span class="pip"></span>
    </div>
    <div class="hint">click: open ROOKI · right-click: menu</div>
    <div class="rcon" id="rcon" aria-live="polite">
      <div class="row"><span class="chip you">You</span><span class="txt" id="ruser"></span></div>
      <div class="row"><span class="chip roo">Rooki</span><span class="txt" id="rroo"></span></div>
    </div>
  </div>
  <script>
    const $ = (s) => document.querySelector(s);
    const icon = $("#ficon");
    const bubble = $("#rcon");
    const userTxt = $("#ruser");
    const roo = $("#rroo");
    let fadeTimer = null;
    let latest = null;

    function setState(s) { icon.setAttribute("data-state", s || "idle"); }
    function applySettings(s) {
      const root = document.documentElement.style;
      if (s.size) root.setProperty("--isize", Math.round(s.size) + "px");
      if (typeof s.opacity === "number") root.setProperty("--iop", s.opacity);
      if (typeof s.convOpacity === "number") root.setProperty("--cop", s.convOpacity);
      latest = s || latest;
    }

    function showConv(user, rooki, opts) {
      const s = latest || {};
      const fadeMs = (opts && opts.fadeMs) || s.fadeMs || 5000;
      userTxt.textContent = user || "";
      roo.textContent = rooki || "";
      userTxt.parentElement.style.display = user ? "" : "none";
      if (!user && !rooki) { bubble.classList.remove("show"); return; }
      bubble.classList.add("show");
      icon.classList.remove("notify");
      setState((opts && opts.state) || "speaking");
      clearTimeout(fadeTimer);
      fadeTimer = setTimeout(() => {
        bubble.classList.remove("show");
        setState("idle");
      }, fadeMs);
    }

    /* hydrate + wire (rookiFloat comes from the preload contextBridge) */
    window.rookiFloat.settingsGet().then(applySettings);
    window.rookiFloat.onSettings(applySettings);
    window.rookiFloat.onConv(showConv);
    window.rookiFloat.onState(setState);
    window.rookiFloat.onNotify((n) => {
      icon.classList.add("notify");
      showConv("", n && n.text ? n.text : "", { state: "notice", fadeMs: 6000 });
    });
    icon.addEventListener("click", () => window.rookiFloat.restore());
    icon.addEventListener("dblclick", () => window.rookiFloat.restore());
    icon.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); window.rookiFloat.restore(); }
    });
    icon.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      window.rookiFloat.menu();
    });
  </script>
</body>
</html>
